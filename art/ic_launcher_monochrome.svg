<?xml version="1.0" encoding="UTF-8"?>
<!-- Monochrome layer, derived from the foreground of ic_launcher.svg by
     flattening every fill/stroke to a single color and dropping the
     background. Android tints this layer for themed icons (API 33+), so only
     the silhouette survives: any detail that read purely as a color contrast
     is now gone. Hand-tune this file (e.g. turn interior shapes into evenOdd
     cutouts); re-run the generator with the keep-monochrome flag afterwards
     so your edits are not overwritten. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <g id="foreground">
    
    <g fill="#FFFFFF" opacity="0.6">
      <circle cx="58" cy="30" r="2.5" />
      <circle cx="70" cy="30" r="2.5" />
      <circle cx="82" cy="30" r="2.5" />
      <circle cx="58" cy="42" r="2.5" />
      <circle cx="82" cy="42" r="2.5" />
      <circle cx="58" cy="54" r="2.5" />
      <circle cx="70" cy="54" r="2.5" />
      <circle cx="82" cy="54" r="2.5" />
    </g>
    
    <circle cx="70" cy="42" r="4" fill="#FFFFFF" filter="url(#glowGreen)" />
    <circle cx="70" cy="42" r="2" fill="#FFFFFF" />
    
    
    <line x1="50" y1="62" x2="70" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" filter="url(#glowGreen)" />
    
    
    <line x1="30" y1="82" x2="16" y2="96" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" filter="url(#glowRed)" />
    <line x1="42" y1="70" x2="30" y2="82" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" filter="url(#glowRed)" />
    
    
